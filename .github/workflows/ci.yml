name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::caret
            any::rpart
            any::pROC
            any::dplyr
            any::jsonlite
            any::testthat
            any::e1071
      - name: Rebuild every result from the raw data
        run: Rscript run_all.R
      - name: Run R tests
        run: Rscript tests/test_pipeline.R
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the browser report scores like R
        run: node tests/test_dashboard.js
